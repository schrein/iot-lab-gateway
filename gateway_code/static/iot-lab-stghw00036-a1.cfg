gdb_port 3333
interface ftdi
transport select swd

# Select FTDI channel corresponding to the XLBEE slot
ftdi_vid_pid 0x0403 0x6011
ftdi_device_desc "Multi IOT USB Interface 0"
#ftdi_serial "SAPT3PTR"
ftdi_channel 0

ftdi_layout_init 0x18 0x1B

ftdi_layout_signal SWD_EN -data 0
ftdi_layout_signal nSRST -data 0x10
ftdi_layout_signal JTCLK -data 0x01

# reset_config srst_only srst_push_pull srst_nogate
# reset_config srst_only srst_push_pull srst_gates_jtag
reset_config none separate
source [find target/swj-dp.tcl]

if { [info exists CHIPNAME] } {
   set _CHIPNAME $CHIPNAME
} else {
   set _CHIPNAME efr32
}

# Work-area is a space in RAM used for flash programming
# By default use 2kB
if { [info exists WORKAREASIZE] } {
   set _WORKAREASIZE $WORKAREASIZE
} else {
   set _WORKAREASIZE 0x800
}

if { [info exists CPUTAPID] } {
   set _CPUTAPID $CPUTAPID
} else {
   if { [using_jtag] } {
      set _CPUTAPID 0x4ba00477
   } {
      set _CPUTAPID 0x2ba01477
   }
}

swj_newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $_CPUTAPID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

adapter_khz 1000

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -dap $_CHIPNAME.dap

$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size $_WORKAREASIZE -work-area-backup 0

set _FLASHNAME $_CHIPNAME.flash
flash bank $_FLASHNAME efm32 0 0 0 0 $_TARGETNAME
# flash bank lockbits.flash efm32 0x0FE04000 0x1000 0 0 $_TARGETNAME
# flash bank userdata.flash efm32 0x0FE00000 0x1000 0 0 $_TARGETNAME
# flash bank deviceinfo.flash efm32 0x0FE081B0 0x1000 0 0 $_TARGETNAME
# flash bank bootloader.flash efm32 0x0FE10000 0x8000 0 0 $_TARGETNAME

if {![using_hla]} {
   # if srst is not fitted use SYSRESETREQ to
   # perform a soft reset
   cortex_m reset_config sysresetreq
}
